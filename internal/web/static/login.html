<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登录 · Crush Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      /* Animated aurora backdrop. */
      .aurora {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      .aurora::before,
      .aurora::after {
        content: '';
        position: absolute;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.55;
        animation: drift 22s ease-in-out infinite alternate;
      }
      .aurora::before {
        background: radial-gradient(circle, #6366f1 0%, transparent 60%);
        top: -20vmax;
        left: -10vmax;
      }
      .aurora::after {
        background: radial-gradient(circle, #ec4899 0%, transparent 60%);
        bottom: -25vmax;
        right: -15vmax;
        animation-delay: -10s;
      }
      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(8vmax, 6vmax) scale(1.15);
        }
      }
      .glass {
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(22px) saturate(140%);
        -webkit-backdrop-filter: blur(22px) saturate(140%);
        border: 1px solid rgba(148, 163, 184, 0.14);
        box-shadow:
          0 30px 60px -20px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      }
      .field {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.18);
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      }
      .field:focus-within {
        border-color: #6366f1;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
      }
      .field input {
        background: transparent;
        outline: none;
        width: 100%;
        color: #e2e8f0;
      }
      .field input::placeholder {
        color: #64748b;
      }
      .btn-primary {
        background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #ec4899);
        background-size: 200% 200%;
        animation: shimmer 8s ease infinite;
        box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.6);
        transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 36px -10px rgba(139, 92, 246, 0.75);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      @keyframes shimmer {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      .logo {
        background: linear-gradient(135deg, #818cf8, #f472b6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .shake {
        animation: shake 0.4s ease-in-out;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-8px); }
        40%, 80% { transform: translateX(8px); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div class="aurora"></div>

    <main
      class="relative z-10 flex min-h-screen items-center justify-center p-6"
    >
      <div id="card" class="glass w-full max-w-md rounded-2xl p-8 sm:p-10">
        <div class="mb-8 flex items-center gap-3">
          <div
            class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 text-xl shadow-lg shadow-indigo-500/30"
          >
            <span aria-hidden="true">✦</span>
          </div>
          <div>
            <h1 class="logo text-2xl font-semibold tracking-tight">
              AI Coding
            </h1>
            <p class="text-xs text-slate-400">AI 网页生成工作台</p>
          </div>
        </div>

        <h2 class="mb-1 text-lg font-medium text-slate-100">欢迎回来</h2>
        <p class="mb-6 text-sm text-slate-400">使用授权账号继续</p>

        <form id="login-form" class="space-y-4" autocomplete="on">
          <label class="block">
            <span
              class="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-400"
              >用户名</span
            >
            <div class="field flex items-center gap-2 rounded-lg px-3 py-2.5">
              <svg
                class="h-4 w-4 text-slate-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                placeholder="请输入用户名"
                class="text-sm"
              />
            </div>
          </label>

          <label class="block">
            <span
              class="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-400"
              >密码</span
            >
            <div class="field flex items-center gap-2 rounded-lg px-3 py-2.5">
              <svg
                class="h-4 w-4 text-slate-500"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="请输入密码"
                class="text-sm"
              />
              <button
                type="button"
                id="toggle-pw"
                class="text-xs text-slate-500 hover:text-slate-300"
                aria-label="显示密码"
              >
                显示
              </button>
            </div>
          </label>

          <p
            id="error"
            class="hidden text-sm text-rose-400"
            role="alert"
          ></p>

          <button
            id="submit"
            type="submit"
            class="btn-primary mt-2 flex w-full items-center justify-center gap-2 rounded-lg py-2.5 text-sm font-semibold text-white"
          >
            <span id="submit-label">登 录</span>
            <svg
              id="spinner"
              class="hidden h-4 w-4 animate-spin"
              viewBox="0 0 24 24"
              fill="none"
            >
              <circle
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="3"
                stroke-opacity="0.25"
              />
              <path
                d="M22 12a10 10 0 0 0-10-10"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-500">
          Crush · single-user web frontend
        </p>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const form = $('login-form');
      const errEl = $('error');
      const submit = $('submit');
      const label = $('submit-label');
      const spinner = $('spinner');
      const card = $('card');
      const togglePw = $('toggle-pw');
      const pw = $('password');

      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/';

      togglePw.addEventListener('click', () => {
        const showing = pw.type === 'text';
        pw.type = showing ? 'password' : 'text';
        togglePw.textContent = showing ? '显示' : '隐藏';
      });

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
        card.classList.remove('shake');
        // Force reflow so animation restarts.
        void card.offsetWidth;
        card.classList.add('shake');
      }

      function setLoading(b) {
        submit.disabled = b;
        if (b) {
          label.textContent = '登录中…';
          spinner.classList.remove('hidden');
        } else {
          label.textContent = '登 录';
          spinner.classList.add('hidden');
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.classList.add('hidden');
        setLoading(true);
        try {
          const r = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: $('username').value,
              password: pw.value,
              next,
            }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            showError(data.error || `登录失败 (${r.status})`);
            setLoading(false);
            return;
          }
          location.href = data.redirect || '/';
        } catch (err) {
          showError('网络错误：' + err.message);
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
