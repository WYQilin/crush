# nginx.conf — coding.yaqi.wang 反代 Crush web (Go, 127.0.0.1:8085)
#
# 部署方式：
#   1) 拷贝到服务器：sudo cp nginx.conf /etc/nginx/conf.d/coding.yaqi.wang.conf
#   2) 确认主 nginx.conf 的 http {} 中有 map $http_upgrade $connection_upgrade {...}
#      （见文件末尾说明，缺失则把 map 块放到 /etc/nginx/conf.d/ 下任一文件）
#   3) sudo nginx -t && sudo systemctl reload nginx

# ---------- 上游 ----------
upstream crush_backend {
    server 127.0.0.1:8085;
    keepalive 64;
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    server_name coding.example.com;

    # certbot HTTP-01 校验
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    http2 on;
    server_name coding.example.com;

    # TODO: 填入证书路径
    ssl_certificate     ;   # 例如 /etc/letsencrypt/live/coding.yaqi.wang/fullchain.pem
    ssl_certificate_key ;   # 例如 /etc/letsencrypt/live/coding.yaqi.wang/privkey.pem

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 全站确认 HTTPS 后再开启 HSTS：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 通用 proxy 默认值（各 location 覆盖差异项） ----------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    # 复用 upstream keepalive：清空 Connection 头
    proxy_set_header   Connection        "";
    proxy_redirect     off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_buffering         on;
    proxy_request_buffering on;
    proxy_buffers           16 16k;
    proxy_busy_buffers_size 32k;

    # gzip
    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml;
    gzip_vary       on;

    client_max_body_size    50m;
    client_body_buffer_size 128k;

    # ---------- 1) SSE 事件流：禁缓冲、长超时 ----------
    location ~ ^/v1/workspaces/[^/]+/events$ {
        proxy_pass http://crush_backend;

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering no always;
        gzip off;
    }

    # ---------- 2) Agent 调用：长任务、流式 ----------
    location ~ ^/v1/workspaces/[^/]+/agent {
        proxy_pass http://crush_backend;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      30m;
        proxy_send_timeout      30m;
    }

    # ---------- 3) 预览 iframe：禁缓存，便于覆盖刷新 ----------
    location ^~ /preview/ {
        proxy_pass http://crush_backend;
        proxy_buffering on;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 4) WebSocket（预留） ----------
    location ~ ^/(ws|websocket) {
        proxy_pass http://crush_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---------- 5) 静态资源：短缓存 ----------
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        proxy_pass http://crush_backend;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ---------- 6) 其余 ----------
    location / {
        proxy_pass http://crush_backend;
    }
}

# ---------- 必备：放在主 nginx.conf 的 http {} 内（仅一次） ----------
